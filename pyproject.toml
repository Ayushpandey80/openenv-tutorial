[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-triage-env"
version = "1.0.0"
description = "Clinical Triage Gym — an OpenEnv RL environment for medical triage training"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "faker>=33.0.0",
    "gradio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
inference = [
    "openai>=1.0.0",
]

[project.scripts]
server = "triage_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["triage_env", "triage_env.server"]
package-dir = { "triage_env" = ".", "triage_env.server" = "server" }
